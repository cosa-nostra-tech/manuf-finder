<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Agentic Growth System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#000;overflow-x:hidden}

/* ===== LANDING ===== */
.landing{padding:64px 80px;min-height:100vh}
.landing-title{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px}
.landing-subtitle{font-size:13px;font-weight:400;color:rgba(0,0,0,.45);margin-bottom:56px}
.section-label{font-size:14px;font-weight:600;margin-bottom:24px}

/* Cards — narrow vertical, matching reference */
.card-stack{display:grid;grid-template-columns:repeat(auto-fill,320px);gap:20px;justify-content:start}
.cap-card{border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s;border:1px solid rgba(0,0,0,.06)}
.cap-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.1)}
.cap-card:active{transform:translateY(0)}
.cap-img{width:100%;height:240px;object-fit:cover;display:block;background:#f0f0f0}
.cap-body{background:#000;padding:20px 22px 22px}
.cap-pill{display:inline-block;font-size:11px;font-weight:500;padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);color:#fff;margin-bottom:14px}
.cap-name{font-size:16px;font-weight:500;color:#fff;margin-bottom:6px;letter-spacing:-.2px}
.cap-desc{font-size:12px;font-weight:400;color:#fff;line-height:1.5;margin-bottom:10px;opacity:1}
.cap-cta{font-size:11px;font-weight:400;color:rgba(255,255,255,.5)}

/* New card */
.new-card{width:320px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.15);padding:44px 32px;text-align:center;cursor:pointer;transition:all .2s;background:#111}
.new-card:hover{border-color:rgba(255,255,255,.3);background:#1a1a1a}
.new-card .plus{font-size:28px;color:rgba(255,255,255,.25);margin-bottom:8px}
.new-card .label{font-size:12px;font-weight:500;color:rgba(255,255,255,.4)}

/* ===== FLOW VIEW ===== */
.flow-view{display:none;min-height:100vh}
.flow-view.active{display:block;background:#111}

.flow-header{padding:18px 80px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(17,17,17,.95);backdrop-filter:blur(12px);z-index:100}
.flow-back{font-size:12px;font-weight:500;cursor:pointer;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:6px;border:none;background:none;padding:0;transition:color .15s}
.flow-back:hover{color:#fff}
.flow-title{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#fff}
.flow-actions{display:flex;gap:8px}
.flow-btn{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.flow-btn:hover{background:rgba(255,255,255,.04)}
.flow-btn.primary{background:#3b82f6;color:#fff;border-color:#3b82f6}
.flow-btn.primary:hover{background:#2563eb}

/* Metrics */
.metrics{display:flex;gap:16px;padding:14px 80px;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;background:#111}
.m{min-width:100px;flex-shrink:0}
.m-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.3);font-weight:600;margin-bottom:1px}
.m-val{font-size:22px;font-weight:700;letter-spacing:-.5px;color:#fff}
.m-sub{font-size:10px;color:rgba(255,255,255,.3)}

/* View tabs */
.vtabs{display:flex;gap:0;padding:0 80px;border-bottom:1px solid rgba(255,255,255,.06);background:#111}
.vt{padding:10px 16px;font-size:11px;font-weight:500;color:rgba(255,255,255,.3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.vt:hover{color:rgba(255,255,255,.6)}
.vt.active{color:#fff;border-bottom-color:#fff;font-weight:600}

/* Pipeline */
.pipe{display:flex;gap:12px;padding:14px 80px;overflow-x:auto;min-height:calc(100vh - 200px);background:#111}
.p-col{min-width:210px;max-width:250px;flex:1;display:flex;flex-direction:column}
.p-head{padding:8px 12px;font-size:11px;font-weight:600;display:flex;justify-content:space-between;align-items:center;border-radius:8px 8px 0 0}
.p-cnt{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5)}
.p-cards{flex:1;padding:6px 0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:calc(100vh - 280px)}
.p-card{background:#1a1a1a;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.p-card:hover{border-color:rgba(255,255,255,.15);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.p-name{font-size:12px;font-weight:600;margin-bottom:3px;color:#fff}
.p-meta{font-size:10px;color:rgba(255,255,255,.4);display:flex;gap:8px}
.p-bars{display:flex;gap:6px;margin-top:6px}
.p-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.p-fill{height:100%;border-radius:2px}
.p-chip{font-size:9px;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);margin-top:5px;display:inline-block}

/* Funnel */
.funnel{padding:28px 80px;display:flex;flex-direction:column;align-items:center;min-height:calc(100vh - 200px);background:#111}
.f-row{display:flex;align-items:center;margin:3px 0;cursor:pointer;transition:all .15s}
.f-row:hover{transform:scale(1.01)}
.f-bar{height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;min-width:90px;transition:width .3s}
.f-info{margin-left:14px}
.f-lbl{font-size:12px;font-weight:600;color:#fff}
.f-drop{font-size:10px;color:rgba(255,255,255,.3)}

/* Workflow */
.wflow{padding:28px 80px;display:flex;justify-content:center;min-height:calc(100vh - 200px);background:#111}
.wf-col{display:flex;flex-direction:column;align-items:center;gap:0}
.wf-phase{width:240px;border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;background:#1a1a1a}
.wf-phase:hover{border-color:rgba(255,255,255,.2);background:#222}
.wf-ptitle{font-size:12px;font-weight:700;margin-bottom:5px;color:#fff}
.wf-steps{font-size:10px;color:rgba(255,255,255,.4);line-height:1.7}
.wf-steps li{margin-left:12px}
.wf-arr{font-size:16px;color:rgba(255,255,255,.15);padding:3px 0}

/* Table */
.tbl-wrap{padding:14px 80px;overflow-x:auto;background:#111}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 10px;text-align:left;border-bottom:2px solid rgba(255,255,255,.08);font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:rgba(255,255,255,.35);position:sticky;top:0;background:#111}
td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.7)}
tr:hover td{background:rgba(255,255,255,.02)}
tr{cursor:pointer}
.ctag{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:600}
.ct-v{background:rgba(34,197,94,.08);color:#16a34a}
.ct-c{background:rgba(245,158,11,.08);color:#d97706}
.ct-u{background:rgba(239,68,68,.05);color:#dc2626}

/* Modal */
.mbg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;z-index:300;justify-content:center;align-items:center}
.mbg.show{display:flex}
.mbox{background:#1a1a1a;border-radius:14px;width:92%;max-width:880px;max-height:90vh;overflow:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;border:1px solid rgba(255,255,255,.08)}
.mbox::-webkit-scrollbar{width:5px}
.mbox::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:5px}
.mtop{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#1a1a1a;z-index:1}
.mtop h2{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#f9fafb}
.mx{background:none;border:none;font-size:16px;color:#9ca3af;cursor:pointer}
.minner{padding:20px;max-height:calc(100vh - 60px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.ms{margin-bottom:16px}
.ms h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.35);margin-bottom:8px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfl{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:rgba(255,255,255,.3);margin-bottom:1px}
.mfv{font-size:12px;font-weight:500;color:#fff}
.mfv.e{color:rgba(255,255,255,.2);font-style:italic}

/* Actions */
.act-row{display:flex;flex-wrap:wrap;gap:6px}
.ab{padding:7px 13px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff}
.ab:hover{background:rgba(255,255,255,.05)}
.ab.go{background:#3b82f6;color:#fff;border-color:#3b82f6}
.ab.go:hover{background:#2563eb}
.ab.no{color:#f87171;border-color:rgba(248,113,113,.3)}
.ab.wa{color:#fbbf24;border-color:rgba(251,191,36,.3)}

/* Conversation */
.cvbox{margin-top:8px;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;background:#1a1a1a}
.cvhead{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;background:#1a1a1a}
.cvht{font-size:11px;font-weight:600;color:rgba(255,255,255,.4)}
.cvch{font-size:9px;padding:2px 6px;border-radius:3px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.4)}
.cvbody{padding:12px;max-height:320px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;background:#1a1a1a}
.cvbody::-webkit-scrollbar{width:3px}
.cvbody::-webkit-scrollbar-thumb{background:rgba(0,0,0,.08);border-radius:3px}
.cm{display:flex;gap:7px;margin-bottom:10px;align-items:flex-start}
.cm.out{flex-direction:row-reverse}
.ca{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.cm.out .ca{background:rgba(255,255,255,.08)}
.cm.in .ca{background:rgba(255,255,255,.04)}
.cb{max-width:76%;padding:7px 10px;border-radius:8px;font-size:11px;line-height:1.5;word-break:break-word}
.cm.out .cb{background:#2a2a2a;color:#e5e7eb;border:1px solid rgba(255,255,255,.08)}
.cm.in .cb{background:#222;border:1px solid rgba(255,255,255,.08);color:#fff}
.cmm{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.ctm{font-size:9px;color:rgba(255,255,255,.25)}
.cac{font-size:8px;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.05);font-weight:600;color:rgba(255,255,255,.4)}
/* Draft message */
.cb.draft-bubble{position:relative;border:1px dashed rgba(59,130,246,.3);background:#2a2a2a;color:#e5e7eb}
.draft-tag{display:inline-flex;align-items:center;gap:3px;font-size:8px;padding:1px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-left:auto}
.draft-tag .bolt{color:#fbbf24;font-size:7px}
.approved-tag{display:inline-flex;align-items:center;gap:3px;font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.email-subject{font-size:10px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.send-outreach-btn{width:100%;padding:9px;border-radius:7px;background:#3b82f6;color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;transition:all .12s}
.send-outreach-btn:hover{background:#2563eb}
.send-outreach-btn.disabled{opacity:.4;pointer-events:none}


/* Translation toggle */
.trb{font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.4);cursor:pointer;transition:all .12s;font-weight:500}
.trb:hover{background:rgba(255,255,255,.04)}
.trb.on{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.ctr{margin-top:4px;padding:5px 8px;border-radius:5px;background:rgba(59,130,246,.08);border:1px dashed rgba(59,130,246,.2);font-size:10px;line-height:1.4;color:#60a5fa;display:none}
.ctr.vis{display:block}
.ctrl{font-size:7px;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.3);margin-bottom:1px;font-weight:600}

/* Suggest + compose */
.csg{margin-top:5px;padding:7px 10px;border:1px dashed rgba(255,255,255,.1);border-radius:5px;background:rgba(255,255,255,.02)}
.csgl{font-size:8px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.3px;font-weight:600;margin-bottom:3px}
.csgc{display:flex;flex-wrap:wrap;gap:3px}
.csgch{padding:3px 7px;border-radius:4px;font-size:10px;border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .1s;background:rgba(255,255,255,.05);color:rgba(255,255,255,.7)}
.csgch:hover{border-color:rgba(255,255,255,.2)}
.ccbar{padding:7px 10px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:5px;background:#1a1a1a}
.ccinput{flex:1;padding:5px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.12);background:#222;color:#fff;font-size:11px;outline:none;font-family:inherit}
.ccinput:focus{border-color:rgba(255,255,255,.3)}
.ccsend{padding:5px 12px;border-radius:5px;background:#3b82f6;color:#fff;border:none;font-size:11px;font-weight:600;cursor:pointer}
.ccsend:hover{background:#2563eb}

/* Wizard */
.ws{margin-bottom:16px}
.ws h4{font-size:12px;font-weight:700;margin-bottom:8px;color:rgba(255,255,255,.8)}
.wo{padding:10px 14px;border:1px solid rgba(255,255,255,.12);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .12s;font-size:12px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.9)}
.wo:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}
.wo.sel{border-color:#000;background:rgba(0,0,0,.03);font-weight:600}
.winp{width:100%;padding:8px 12px;border-radius:6px;border:1px solid rgba(0,0,0,.08);font-size:12px;outline:none;font-family:inherit}
.winp:focus{border-color:rgba(0,0,0,.2)}
.wtags{display:flex;flex-wrap:wrap;gap:5px}
.wtag{padding:4px 10px;border-radius:5px;font-size:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .1s;font-weight:500;color:rgba(255,255,255,.65)}
.wtag:hover,.wtag.sel{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);font-weight:600;color:rgba(255,255,255,.9)}
.wlaunch{width:100%;padding:11px;border-radius:8px;background:#000;color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer}
.wlaunch:hover{opacity:.85}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cap-card{animation:fadeUp .25s ease both}
.cap-card:nth-child(2){animation-delay:.04s}
.cap-card:nth-child(3){animation-delay:.08s}

@media(max-width:768px){
  .landing,.flow-header,.metrics,.vtabs,.pipe,.funnel,.wflow,.tbl-wrap{padding-left:20px!important;padding-right:20px!important}
  .card-stack{width:100%}
  .mg{grid-template-columns:1fr}
}

.act-tag{display:inline-block;font-size:7px;text-transform:uppercase;letter-spacing:.5px;padding:1px 5px;border-radius:3px;margin-top:3px;font-weight:600}
.act-tag.agent{background:rgba(139,92,246,.15);color:#a78bfa}
.act-tag.human{background:rgba(34,197,94,.15);color:#4ade80}
.ctr{margin-top:6px!important;padding:8px 10px!important;border-radius:6px!important;background:rgba(59,130,246,.06)!important;border:1px dashed rgba(59,130,246,.25)!important;font-size:11px!important;line-height:1.5!important;color:#60a5fa!important;display:none}
.ctr.vis{display:block}
.ctrl{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.35);margin-bottom:4px;font-weight:600}


/* ===== BRIEF FORM (dark theme) ===== */
.brief-modal{background:#1a1a1a;border-radius:12px;max-width:860px;width:95vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;color:#e5e7eb;font-family:Inter,system-ui,sans-serif;border:1px solid rgba(255,255,255,.08)}
.brief-header{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start}
.brief-brand{font-size:13px;font-weight:600;color:#9ca3af;margin-bottom:2px}
.brief-product-name{font-size:17px;font-weight:700;color:#f9fafb;margin-bottom:12px}
.brief-icons{display:flex;gap:8px}
.brief-icon{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#9ca3af;transition:all .15s}
.brief-icon:hover{background:rgba(255,255,255,.06);color:#e5e7eb}
.brief-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.08);padding:0 24px;margin-top:8px}
.brief-tab{padding:10px 16px;font-size:12px;font-weight:600;color:#9ca3af;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.brief-tab:hover{color:#e5e7eb}
.brief-tab.active{color:#60a5fa;border-bottom-color:#60a5fa}
.brief-body{padding:24px;overflow-y:auto;flex:1;max-height:calc(90vh - 130px)}
.brief-section{margin-bottom:24px}
.brief-section-title{font-size:13px;font-weight:700;color:#f9fafb;margin-bottom:4px}
.brief-section-sub{font-size:11px;color:#9ca3af;margin-bottom:12px}
.brief-row{display:flex;gap:16px;margin-bottom:12px}
.brief-field{flex:1}
.brief-label{font-size:11px;font-weight:600;color:#d1d5db;margin-bottom:4px;display:block}
.brief-input{width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:6px;font-size:12px;color:#f9fafb;background:#111;outline:none;transition:border .15s;box-sizing:border-box;font-family:inherit}
.brief-input:focus{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.15)}
.brief-input::placeholder{color:#6b7280}
.brief-textarea{min-height:80px;resize:vertical;line-height:1.5}
.brief-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.brief-tag{padding:4px 10px 4px 8px;border-radius:5px;font-size:11px;font-weight:500;background:rgba(96,165,250,.12);color:#93c5fd;border:1px solid rgba(96,165,250,.25);cursor:pointer;display:flex;align-items:center;gap:4px}
.brief-tag .tag-x{font-size:10px;color:#60a5fa;cursor:pointer;margin-left:2px}
.brief-tag .tag-x:hover{color:#93c5fd}
.brief-tag-add{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:500;background:rgba(255,255,255,.03);color:#9ca3af;border:1px dashed rgba(255,255,255,.15);cursor:pointer}
.brief-tag-add:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25)}
.brief-meta{font-size:11px;color:#9ca3af;display:flex;gap:16px}
.brief-save{width:100%;padding:11px;border-radius:8px;background:#3b82f6;color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:8px}
.brief-save:hover{background:#2563eb}
.brief-save:active{background:#1d4ed8}
.pdf-drop{border:2px dashed rgba(255,255,255,.15);border-radius:10px;padding:32px 24px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.02);margin-bottom:20px;position:relative}
.pdf-drop:hover{border-color:#60a5fa;background:rgba(96,165,250,.06)}
.pdf-drop.dragover{border-color:#60a5fa;background:rgba(96,165,250,.12);transform:scale(1.01)}
.pdf-drop-icon{font-size:28px;margin-bottom:8px}
.pdf-drop-text{font-size:13px;font-weight:600;color:#e5e7eb;margin-bottom:4px}
.pdf-drop-sub{font-size:11px;color:#9ca3af}

const STATES = [{"key": "DISCOVERED", "label": "Discovered", "icon": "\ud83d\udd0d", "color": "#6366f1"}, {"key": "ENRICHED", "label": "Enriched", "icon": "\ud83d\udcca", "color": "#3b82f6"}, {"key": "AGENT_TO_SEND", "label": "Agent to send", "icon": "\ud83e\udd16", "color": "#8b5cf6"}, {"key": "OUTREACH_SENT", "label": "Outreach Sent", "icon": "\ud83d\udce7", "color": "#f59e0b"}, {"key": "CONVERSING", "label": "Conversing", "icon": "\ud83d\udcac", "color": "#22c55e"}, {"key": "QUALIFIED", "label": "Qualified", "icon": "\u2705", "color": "#22d3ee"}, {"key": "HUMAN_HANDOFF", "label": "Handoff", "icon": "\ud83d\udc64", "color": "#a855f7"}, {"key": "NOT_INTERESTED", "label": "Not Interested", "icon": "\u274c", "color": "#ef4444"}, {"key": "UNRESPONSIVE", "label": "Unresponsive", "icon": "\u23f3", "color": "#94a3b8"}];

const API_BASE = 'https://manuf-finder-production.up.railway.app';
let curFlow = null;

/* ===== LANDING ===== */
function getLocalBriefs() {
  return JSON.parse(localStorage.getItem('pendingBriefs') || '[]');
}

function renderLanding() {
  const el = document.getElementById('card-stack');
  fetch(API_BASE + '/api/briefs')
  .then(r => { if (!r.ok) throw new Error('API unavailable'); return r.json(); })
  .then(briefs => {
    window._briefFlows = briefs;
    window._apiAvailable = true;
    renderBriefCards(el, briefs);
  })
  .catch(() => {
    window._apiAvailable = false;
    // Merge hardcoded FLOWS with localStorage briefs
    const localBriefs = getLocalBriefs();
    const apiBriefs = FLOWS.map((f, i) => ({
      id: 1000 + i, // use IDs that won't collide with localStorage
      product_name: f.full_name || f.name,
      category: f.category,
      description: f.description,
      status: 'OUTREACH_DRAFTED',
      _supplier_count: f.supplier_ids.length
    }));
    window._briefFlows = [...localBriefs, ...apiBriefs];
    renderBriefCards(el, window._briefFlows);
  });
}

function renderBriefCards(el, briefs) {
  let h = '';
  briefs.forEach(b => {
    const status = b.status || 'DRAFT';
    const statusLabel = status.replace(/_/g, ' ');
    const supplierCount = b._supplier_count || 0;
    const icon = b.category === 'Skincare' ? '🧴' : b.category === 'Home Textiles' ? '🧖' : b.category === 'Sleep Accessories' ? '😴' : '📦';
    h += `<div class="cap-card" onclick="openBriefFlow(${b.id})">
      <div class="cap-img-placeholder" style="height:120px;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.7">${icon}</div>
      <div class="cap-body">
        <div class="cap-pill">${supplierCount} suppliers · ${statusLabel}</div>
        <div class="cap-name">${b.product_name || 'Untitled'}</div>
        <div class="cap-desc">${(b.description || '').substring(0, 90)}${(b.description||'').length > 90 ? '…' : ''}</div>
        <div class="cap-cta">Click for pipeline</div>
      </div>
    </div>`;
  });
  h += `<div class="new-card" onclick="openWiz()">
      <div class="plus">+</div>
      <div class="label">New Capability Search</div>
    </div>`;
  el.innerHTML = h;
}

function openBriefFlow(briefId) {
  window._currentBriefId = briefId;
  window._isNewBrief = false;
  // Find the brief data — check _briefFlows first, then localStorage
  let brief = (window._briefFlows || []).find(b => b.id === briefId);
  if (!brief) {
    const local = getLocalBriefs().find(b => b.id === briefId);
    if (local) brief = local;
  }
  if (!brief) return;
  curFlow = {
    id: 'brief-' + briefId,
    name: brief.product_name,
    full_name: brief.product_name,
    category: brief.category,
    brief_id: briefId
  };
  document.getElementById('landing').style.display = 'none';
  document.getElementById('flow-view').classList.add('active');
  document.getElementById('ftitle').textContent = curFlow.full_name;
  // Load suppliers for this brief
  loadAndRenderFlow(briefId);
}

function loadAndRenderFlow(briefId) {
  // Try API first
  fetch(`${API_BASE}/api/briefs/${briefId}/suppliers`)
  .then(r => { if (!r.ok) throw new Error('API unavailable'); return r.json(); })
  .then(suppliers => {
    window._apiAvailable = true;
    // Map API suppliers to the DATA format the flow view expects
    DATA = suppliers.map(s => ({
      id: s.id,
      trade_name: s.trade_name,
      factory_locations: s.factory_locations || '',
      supplier_type: s.supplier_type || '',
      outreach_state: s.outreach_state || 'DISCOVERED',
      certs_and_audits: s.certs_and_audits || '',
      email: s.email || '',
      website: s.website || '',
      wechat_id: s.wechat_id || '',
      data_completeness_score: s.data_completeness_score || 0,
      quality_score: s.quality_score || 0,
      match_score: s.match_score || 0,
      product_sub_categories: s.product_sub_categories || '',
      _country: (s.factory_locations || '').split(',')[0].trim(),
    }));
    loadConversations(suppliers.map(s=>s.id), briefId);
    renderFlow();
  })
  .catch(() => {
    window._apiAvailable = false;
    // No API — use local suppliers if any, else show empty pipeline with status message
    const localSuppliers = JSON.parse(localStorage.getItem(`briefSuppliers_${briefId}`) || '[]');
    DATA = localSuppliers.map(s => ({
      id: s.id,
      trade_name: s.trade_name,
      factory_locations: s.factory_locations || '',
      supplier_type: s.supplier_type || '',
      outreach_state: s.outreach_state || 'DISCOVERED',
      certs_and_audits: s.certs_and_audits || '',
      email: s.email || '',
      website: s.website || '',
      wechat_id: s.wechat_id || '',
      data_completeness_score: 0,
      quality_score: 0,
      match_score: 0,
      product_sub_categories: s.product_sub_categories || '',
      _country: (s.factory_locations || '').split(',')[0].trim(),
    }));
    CONVOS = {};
    renderFlow();
    // Show API-unavailable banner in pipeline
    if (!localSuppliers.length) {
      const pipeEl = document.getElementById('v-pipe');
      if (pipeEl) {
        pipeEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#94a3b8;">
          <div style="font-size:48px;margin-bottom:16px">🔌</div>
          <div style="font-size:18px;font-weight:600;color:#e2e8f0;margin-bottom:8px">Backend API Not Connected</div>
          <div style="font-size:13px;max-width:400px;margin:0 auto;line-height:1.6">The discovery agent runs on the backend server. Start the API server to trigger supplier discovery, enrichment, and outreach drafting.<br><br><code style="background:#1e293b;padding:4px 8px;border-radius:4px;font-size:12px">python3 -m uvicorn api:app --port 8000</code></div>
        </div>` + pipeEl.innerHTML;
      }
    }
  });
}

function loadConversations(supplierIds, briefId) {
  // Fetch all conversations and index by supplier
  fetch(API_BASE + '/api/conversations')
  .then(r => r.json())
  .then(msgs => {
    CONVOS = {};
    msgs.forEach(m => {
      if (!CONVOS[m.supplier_id]) CONVOS[m.supplier_id] = [];
      CONVOS[m.supplier_id].push(m);
    });
  })
  .catch(() => { CONVOS = {}; });
}

function openFlow(id) {
  curFlow = FLOWS.find(f => f.id === id);
  if (!curFlow) return;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('flow-view').classList.add('active');
  document.getElementById('ftitle').textContent = curFlow.full_name || curFlow.name;
  renderFlow();
}

function goBack() {
  curFlow = null;
  document.getElementById('flow-view').classList.remove('active');
  document.getElementById('landing').style.display = '';
}

/* ===== FLOW ===== */
function fData() {
  // If using API-driven flow, DATA is already filtered to the brief's suppliers
  if (curFlow && curFlow.brief_id) return DATA;
  return curFlow ? DATA.filter(s => curFlow.supplier_ids.includes(s.id)) : [];
}

function renderFlow() {
  renderMetrics();
  renderPipe();
  renderFunnel();
  renderWflow();
  renderTbl();
}

function renderMetrics() {
  const ss = fData();
  const en = ss.filter(s => ['ENRICHED','OUTREACH_SENT','CONVERSING','QUALIFIED','HUMAN_HANDOFF'].includes(s.outreach_state)).length;
  const ou = ss.filter(s => ['OUTREACH_SENT','CONVERSING','QUALIFIED','HUMAN_HANDOFF'].includes(s.outreach_state)).length;
  const qu = ss.filter(s => ['QUALIFIED','HUMAN_HANDOFF'].includes(s.outreach_state)).length;
  const aq = ss.length ? Math.round(ss.reduce((a,s)=>a+(s.qualification_score||0),0)/ss.length) : 0;
  const ac = ss.length ? Math.round(ss.reduce((a,s)=>a+(s.data_completeness_score||0),0)/ss.length) : 0;
  const ms = ss.reduce((a,s) => a + (CONVOS[s.id]?CONVOS[s.id].length:0), 0);
  document.getElementById('metrics').innerHTML = `
    <div class="m"><div class="m-label">Total</div><div class="m-val">${ss.length}</div></div>
    <div class="m"><div class="m-label">Enriched</div><div class="m-val">${en}</div></div>
    <div class="m"><div class="m-label">Outreached</div><div class="m-val">${ou}</div></div>
    <div class="m"><div class="m-label">Qualified</div><div class="m-val">${qu}</div></div>
    <div class="m"><div class="m-label">Avg Quality</div><div class="m-val">${aq}<span class="m-sub">/100</span></div></div>
    <div class="m"><div class="m-label">Avg Complete</div><div class="m-val">${ac}<span class="m-sub">/100</span></div></div>
    <div class="m"><div class="m-label">Messages</div><div class="m-val">${ms}</div></div>
  `;
}

function renderPipe() {
  const ss = fData();
  const el = document.getElementById('v-pipe');
  let h = '';
  const ACTIVITY = {'DISCOVERED':'agent','ENRICHED':'agent','AGENT_TO_SEND':'agent','OUTREACH_SENT':'agent','CONVERSING':'human','QUALIFIED':'human','HUMAN_HANDOFF':'human','NOT_INTERESTED':'human','UNRESPONSIVE':'human'};
  STATES.forEach(st => {
    const col = ss.filter(s => (s.outreach_state||'DISCOVERED')===st.key);
    const at = ACTIVITY[st.key]||'agent';
    h += `<div class="p-col"><div class="p-head" style="background:${st.color}08;border-bottom:2px solid ${st.color}20"><div style="display:flex;justify-content:space-between;align-items:center"><span style="color:${st.color}">${st.icon} ${st.label}</span><span class="p-cnt">${col.length}</span></div><span class="act-tag ${at}">${at==='agent'?'🤖 Agent':'👤 Human'}</span></div><div class="p-cards">`;
    col.forEach(s => {
      const qs=s.qualification_score||0, cs=s.data_completeness_score||0;
      const ch=s.outreach_channel||'', mc=CONVOS[s.id]?CONVOS[s.id].length:0;
      h += `<div class="p-card" onclick="showD(${s.id})">
        <div class="p-name">${s.trade_name}</div>
        <div class="p-meta"><span>${s._country}</span>${mc?`<span>💬${mc}</span>`:''}${s.reply_count?`<span>↩️${s.reply_count}</span>`:''}</div>
        <div class="p-bars"><div class="p-bar"><div class="p-fill" style="width:${qs}%;background:${qs>=70?'#22c55e':qs>=40?'#f59e0b':'#ef4444'}"></div></div><div class="p-bar"><div class="p-fill" style="width:${cs}%;background:#3b82f6"></div></div></div>
        ${ch?`<div class="p-chip">${ch==='wechat'?'💚 WeChat':ch==='email'?'✉️ Email':ch==='zalo'?'💜 Zalo':ch==='line'?'💚 LINE':ch==='whatsapp'?'📱 WhatsApp':ch}</div>`:''}
      </div>`;
    });
    h += '</div></div>';
  });
  el.innerHTML = h;
}

function renderFunnel() {
  const ss = fData();
  const el = document.getElementById('v-funnel');
  const stages = ['DISCOVERED','ENRICHED','OUTREACH_SENT','CONVERSING','QUALIFIED','HUMAN_HANDOFF'];
  const counts = stages.map(st => ss.filter(s => stages.indexOf(s.outreach_state||'DISCOVERED')>=stages.indexOf(st)).length);
  const mx = Math.max(...counts,1);
  let h = '<div style="display:flex;flex-direction:column;align-items:center;padding-top:16px">';
  stages.forEach((st,i) => {
    const state = STATES.find(s=>s.key===st);
    const c=counts[i], pct=Math.max(Math.round(c/mx*100),12);
    const prev=i>0?counts[i-1]:c;
    const drop=i>0&&prev>0?Math.round((1-c/prev)*100):0;
    h += `<div class="f-row" onclick="sv('pipe')"><div class="f-bar" style="width:${pct}%;background:${state.color}">${state.icon} ${c}</div><div class="f-info"><div class="f-lbl">${state.label}</div>${drop?`<div class="f-drop">↓${drop}% drop</div>`:''}</div></div>`;
  });
  h += '</div>';
  el.innerHTML = h;
}

function renderWflow() {
  const el = document.getElementById('v-wflow');
  const phases = [
    {icon:'🔍',title:'INDEX',steps:['Discover new manufacturers','Enrich profiles (27+ fields)','Verify certifications','Score quality & completeness','Deduplicate against master DB']},
    {icon:'📧',title:'OUTREACH',steps:['Select channel by region','Personalize message by profile','A/B test first-touch variants','Send multi-touch sequence','Respect anti-spam & rate limits']},
    {icon:'💬',title:'ENGAGE',steps:['Auto-detect language & translate','Classify intent (interested/no/info)','Ask qualification questions','Track conversation state per flow','Escalate pricing/contracts to human']},
    {icon:'👤',title:'HANDOFF',steps:['Generate handoff brief','Notify sourcing manager','Archive conversation log','Mark as handed off','Track post-handoff status']}
  ];
  let h = '<div class="wf-col">';
  phases.forEach((p,i) => {
    h += `<div class="wf-phase"><div class="wf-ptitle">${p.icon} ${p.title}</div><ul class="wf-steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ul></div>`;
    if (i<phases.length-1) h += '<div class="wf-arr">↓</div>';
  });
  h += '</div>';
  el.innerHTML = h;
}

function renderTbl() {
  const ss = fData();
  const el = document.getElementById('v-tbl');
  const cols = ['trade_name','_country','outreach_state','qualification_score','data_completeness_score','reply_count','outreach_channel','wechat_id','certs_verified'];
  const lbls = ['Name','Country','State','Quality','Complete','Replies','Channel','WeChat','Certs'];
  let h = '<table><thead><tr>';
  lbls.forEach(l => h+=`<th>${l}</th>`);
  h += '</tr></thead><tbody>';
  ss.forEach(s => {
    h += `<tr onclick="showD(${s.id})">`;
    cols.forEach(c => {
      let v = s[c]||'—';
      if (c==='outreach_state'){const st=STATES.find(x=>x.key===(v||'DISCOVERED'));v=st?`${st.icon} ${st.label}`:v;}
      if (c==='certs_verified'){const cls=v==='VERIFIED'?'ct-v':v==='CLAIMED'?'ct-c':'ct-u';v=`<span class="ctag ${cls}">${(v||'UNVERIFIED').toLowerCase()}</span>`;}
      h += `<td>${v}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  el.innerHTML = h;
}

function sv(v) {
  document.querySelectorAll('.vt').forEach(t => t.classList.toggle('active', t.dataset.v===v));
  ['pipe','funnel','wflow','tbl'].forEach(x => {
    document.getElementById('v-'+x).style.display = x===v?'':'none';
  });
}

/* ===== DETAIL MODAL ===== */

  const s = DATA.find(x=>x.id===id);
  if (!s) return;
  const st = STATES.find(x=>x.key===(s.outreach_state||'DISCOVERED'));

    <div><div class="mfl">Quality Score</div><div class="mfv">${s.qualification_score||0}/100</div></div>

    h += `</div>`;
    
    if (hasDraft) {
      h += `<button class="send-outreach-btn" onclick="approveAndSend(${s.id})">📧 Send Outreach</button>`;
    }
    
    const curSt = s.outreach_state||'DISCOVERED';
    const suggs = ({

      h += `</div></div>`;
    }
    
    h += `<div class="ccbar"><input class="ccinput" id="ci-${s.id}" placeholder="Compose a message..." onkeydown="if(event.key==='Enter')sendM(${s.id})"><button class="ccsend" onclick="sendM(${s.id})">Send</button></div></div>`;
  }
  h += `</div>`;
  
  // Actions
  h += `<div class="ms"><h3>Agent Actions</h3><div class="act-row">`;
  const cs = s.outreach_state||'DISCOVERED';
  const nm = {
    'DISCOVERED':[{to:'ENRICHED',label:'▶ Enrich Profile',cls:'go'}],

    'QUALIFIED':[{to:'HUMAN_HANDOFF',label:'👤 Hand Off',cls:'go'}],

    'UNRESPONSIVE':[{to:'OUTREACH_SENT',label:'📧 Re-outreach',cls:'go'}]
  };
  (nm[cs]||[]).forEach(a => {

  });
  h += '</div></div>';
  
  h += '</div>';

  document.getElementById('modal').classList.add('show');
  
  setTimeout(() => { const b = document.getElementById('cvbd-'+s.id); if(b) b.scrollTop = b.scrollHeight; }, 60);
}

function togTr(sid) {
  const btn = document.getElementById('trb-'+sid);
  const box = document.getElementById('cvb-'+sid);
  if (!btn||!box) return;
  const on = btn.classList.toggle('on');
  box.querySelectorAll('.ctr').forEach(el => el.classList.toggle('vis', on));
  btn.textContent = on ? '🌐 Translated ✓' : '🌐 Translate';
}

function useCh(el, text) {
  const input = el.closest('.cvbox').querySelector('.ccinput');
  if (input) input.value = text;
}

function sendM(sid) {
  const input = document.getElementById('ci-'+sid);
  if (!input||!input.value.trim()) return;
  input.value = '';
  toast('📤 Message queued for ' + (DATA.find(s=>s.id===sid)?.trade_name||'supplier'));
}

function approveAndSend(sid) {
  const s = DATA.find(x => x.id === sid);
  if (!s) return;
  toast(`⏳ Approving outreach for ${s.trade_name}...`);
  fetch(API_BASE + '/api/approve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'approve', supplier_ids: [sid]})
  })
  .then(r => r.json())
  .then(res => {
    // Update local state
    const msgs = CONVOS[sid] || [];
    msgs.forEach(m => { if (m.approval_status === 'DRAFT') m.approval_status = 'APPROVED'; });
    s.outreach_state = 'AGENT_TO_SEND';
    toast(`✅ Outreach approved for ${s.trade_name} — agent will send`);
    closeM();
    renderFlow();
  })
  .catch(e => toast('❌ Error: ' + e.message));
}

function trS(id, to) {
  const s = DATA.find(x => x.id === id);
  if (!s) return;
  s.outreach_state = to;
  const st = STATES.find(x => x.key === to);
  toast(`✅ ${s.trade_name} → ${st?.label||to}`);
  closeM();
  renderFlow();
}

function closeM() { document.getElementById('modal').classList.remove('show'); }

function saveBrief() {
  const name = document.getElementById('bf-name')?.textContent || 'New Brief';
  // Collect all form fields
  const data = {
    product_name: name,
    brand: document.getElementById('bf-brand')?.value || '',
    customer: document.getElementById('bf-customer')?.value || '',
    priority: document.getElementById('bf-priority')?.value || 'Medium',
    description: document.getElementById('bf-desc')?.value || '',
    formulation_type: document.getElementById('bf-form-type')?.value || '',
    country_of_origin: Array.from(document.querySelectorAll('#bf-countries .country-tag')).map(e=>e.dataset.v).join(',') || '',
    country_stipulations: document.getElementById('bf-country-stip')?.value || '',
    distribution_channels: Array.from(document.querySelectorAll('#bf-channels .brief-tag')).map(e=>e.dataset.v).join(',') || '',
    delivery_location: document.getElementById('bf-delivery-loc')?.value || '',
    market_position: document.getElementById('bf-market-pos')?.value || '',
    key_ingredients: document.getElementById('bf-ingredients')?.value || '',
    certifications_required: Array.from(document.getElementById('bf-certs')?.selectedOptions||[]).map(o=>o.value).join(', ') || '',
    registrations_required: document.getElementById('bf-registrations')?.value || '',
    manufacturer_stipulations: document.getElementById('bf-mfg-stip')?.value || '',
    documentation_required: document.getElementById('bf-docs')?.value || '',
    usp: document.getElementById('bf-usp')?.value || '',
    packaging_type: document.getElementById('bf-pack-type')?.value || '',
    label_type: document.getElementById('bf-label-type')?.value || '',
    target_regions: document.getElementById('bf-regions')?.value || '',
    annual_volume: document.getElementById('bf-volume')?.value || '',
    price_point: document.getElementById('bf-price')?.value || '',
    sku_count: document.getElementById('bf-skus')?.value || '',
    category: document.getElementById('bf-category')?.value || '',
    date_quote_due: document.getElementById('bf-d1')?.value || '',
    date_delivery_dc: document.getElementById('bf-d2')?.value || '',
    date_sample_due: document.getElementById('bf-d3')?.value || '',
    date_pp_sample: document.getElementById('bf-d4')?.value || '',
    date_formulation_approval: document.getElementById('bf-d5')?.value || '',
    date_packaging_approval: document.getElementById('bf-d6')?.value || '',
    date_po: document.getElementById('bf-d7')?.value || '',
    date_dispatch: document.getElementById('bf-d8')?.value || '',
  };

  // Determine if we're updating an existing brief or creating a new one
  const existingId = window._currentBriefId;
  const isEditing = existingId && existingId > 0 && !window._isNewBrief;

  toast('⏳ Saving brief & starting discovery...');
  closeW();

  if (isEditing) {
    // Update existing brief + trigger full pipeline
    fetch(API_BASE + '/api/briefs/' + existingId, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(brief => {
      toast('✅ Brief updated! Running full pipeline (discover → enrich → outreach)...');
      // Trigger full pipeline on the existing brief
      fetch(API_BASE + '/api/briefs/' + existingId + '/run-pipeline', {method: 'POST'})
      .then(r => r.json())
      .then(res => {
        toast('🤖 Pipeline started: ' + (res.status || 'ok'));
      });
      // Open the kanban/pipeline view immediately
      openBriefFlow(existingId);
      // Poll for supplier updates as they come in
      pollBriefSuppliers(existingId);
    })
    .catch(e => {
      toast('❌ Error: ' + e.message);
    });
  } else {
    // Create new brief (auto-triggers discovery via api.py)
    fetch(API_BASE + '/api/briefs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    })
    .then(r => {
      if (!r.ok) throw new Error('API returned ' + r.status);
      return r.json();
    })
    .then(brief => {
      window._currentBriefId = brief.id;
      window._isNewBrief = false;
      // Add the new brief to _briefFlows so openBriefFlow can find it
      if (!window._briefFlows) window._briefFlows = [];
      window._briefFlows.unshift(brief);
      toast('✅ "' + name + '" saved! Discovery agent running...');
      // Immediately open the kanban/pipeline view for the new brief
      openBriefFlow(brief.id);
      // Start polling for discovered suppliers
      pollBriefSuppliers(brief.id);
    })
    .catch(e => {
      // API unavailable (static deploy) — save locally and show card + pipeline
      console.log('API unavailable, saving brief locally:', data);
      const localId = Date.now();
      window._currentBriefId = localId;
      window._isNewBrief = false;
      data.id = localId;
      data.status = 'PENDING_API';
      data._supplier_count = 0;
      // Add to _briefFlows so the card renders
      if (!window._briefFlows) window._briefFlows = [];
      window._briefFlows.unshift(data);
      // Add to localStorage for persistence
      const pending = JSON.parse(localStorage.getItem('pendingBriefs') || '[]');
      pending.push({...data, created_at: new Date().toISOString()});
      localStorage.setItem('pendingBriefs', JSON.stringify(pending));
      // Re-render landing so the new card is visible
      renderBriefCards(document.getElementById('card-stack'), window._briefFlows);
      toast('📋 Brief saved! Start backend to trigger discovery →');
      // Open the pipeline view immediately
      openBriefFlow(localId);
    });
  }
}

// Poll for suppliers as the discovery agent works
function pollBriefSuppliers(briefId) {
  let polls = 0;
  const maxPolls = 30; // poll for ~90 seconds (3s intervals)
  const iv = setInterval(() => {
    polls++;
    if (polls > maxPolls || !curFlow || curFlow.brief_id !== briefId) {
      clearInterval(iv);
      return;
    }
    fetch(`${API_BASE}/api/briefs/${briefId}/suppliers`)
    .then(r => r.json())
    .then(suppliers => {
      if (!suppliers.length) return;
      // Update DATA with fresh supplier list
      DATA = suppliers.map(s => ({
        id: s.id,
        trade_name: s.trade_name,
        factory_locations: s.factory_locations || '',
        supplier_type: s.supplier_type || '',
        outreach_state: s.outreach_state || 'DISCOVERED',
        certs_and_audits: s.certs_and_audits || '',
        email: s.email || '',
        website: s.website || '',
        wechat_id: s.wechat_id || '',
        data_completeness_score: s.data_completeness_score || 0,
        quality_score: s.quality_score || 0,
        match_score: s.match_score || 0,
        product_sub_categories: s.product_sub_categories || '',
        _country: (s.factory_locations || '').split(',')[0].trim(),
      }));
      // Also load conversations
      loadConversations(suppliers.map(s=>s.id), briefId);
      // Re-render the pipeline view
      renderFlow();
      // Show progress toast
      const states = {};
      DATA.forEach(s => { states[s.outreach_state] = (states[s.outreach_state]||0)+1; });
      const stateStr = Object.entries(states).map(([k,v])=>`${k}: ${v}`).join(', ');
      toast(`🤖 ${DATA.length} suppliers — ${stateStr}`);
      // If enrichment done, also trigger outreach drafting
      if (DATA.every(s => s.outreach_state === 'ENRICHED') && polls === 10) {
        fetch(`${API_BASE}/api/briefs/${briefId}/draft-outreach`, {method:'POST'});
      }
    })
    .catch(() => {}); // silently ignore poll failures
  }, 3000);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0', 2800);

function agent(a) {
  const briefId = window._currentBriefId;
  if (!briefId) { toast('❌ No brief selected — go back to dashboard first'); return; }
  const endpoint = a === 'enrich' ? `${API_BASE}/api/briefs/${briefId}/enrich`
                 : a === 'outreach' ? `${API_BASE}/api/briefs/${briefId}/draft-outreach`
                 : a === 'full' ? `${API_BASE}/api/briefs/${briefId}/run-pipeline`
                 : null;
  if (!endpoint) { toast('❌ Unknown action'); return; }
  toast(`⏳ Agent running: ${a}...`);
  fetch(endpoint, {method:'POST'})
  .then(r => { if (!r.ok) throw new Error('API returned ' + r.status); return r.json(); })
  .then(res => {
    toast(`🤖 Agent started: ${a} — ${res.status || 'ok'}`);
    // Start polling for updates
    pollBriefSuppliers(briefId);
  })
  .catch(e => toast('❌ Agent error: ' + e.message));
}

// PDF Upload & Parsing
function pdfDragOver(e) { e.preventDefault(); e.stopPropagation(); document.getElementById('pdf-drop').classList.add('dragover'); }
function pdfDragLeave(e) { e.preventDefault(); e.stopPropagation(); document.getElementById('pdf-drop').classList.remove('dragover'); }
function pdfDrop(e) { e.preventDefault(); e.stopPropagation(); document.getElementById('pdf-drop').classList.remove('dragover'); const f=e.dataTransfer.files[0]; if(f&&f.type==='application/pdf') parsePDF(f); }
function pdfUpload(e) { const f=e.target.files[0]; if(f) parsePDF(f); }

async function parsePDF(file) {
  const status = document.getElementById('pdf-status');
  status.style.display = 'block';
  status.className = 'pdf-status';
  status.textContent = '⏳ Reading ' + file.name + '...';

  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let text = '';
    for (let i=1; i<=pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item=>item.str).join(' ') + '\n';
    }

    status.className = 'pdf-status success';
    status.textContent = '✅ Extracted ' + text.length + ' chars from ' + pdf.numPages + ' pages';

    // Auto-fill form fields from extracted text
    autoFillBrief(text);
  } catch(err) {
    status.className = 'pdf-status error';
    status.textContent = '❌ Error: ' + err.message;
  }
}

function autoFillBrief(text) {
  const t = text.toLowerCase();
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  // Brand / product name — try multiple strategies in priority order
  let nameSet = false;
  // Strategy 1: Look for explicit "Product:" or "Product Name:" labels
  const productLabelMatch = text.match(/(?:product(?:\s+name)?|item|sku|brief)\s*[:\-–]\s*(.{3,80})/i);
  if (productLabelMatch) {
    document.getElementById('bf-name').textContent = productLabelMatch[1].trim();
    nameSet = true;
  }
  // Strategy 2: First short line that looks like a title (all caps or title case, 3-60 chars)
  if (!nameSet) {
    for (const line of lines) {
      if (line.length >= 3 && line.length <= 60 &&
          !/^(the|this|we|our|please|dear|from|to|date|attn|ref|page|total|qty|quantity|price|amount|unit|spec)/i.test(line) &&
          !/^\d+$/.test(line) &&
          !/[@:;|]/.test(line) &&
          (line === line.toUpperCase() || /^(?:[A-Z][a-z]+\s*){1,5}$/.test(line))) {
        document.getElementById('bf-name').textContent = line;
        nameSet = true;
        break;
      }
    }
  }
  // Strategy 3: First line that's 3-80 chars (fallback)
  if (!nameSet) {
    for (const line of lines) {
      if (line.length >= 3 && line.length <= 80 && !line.startsWith('http')) {
        document.getElementById('bf-name').textContent = line;
        nameSet = true;
        break;
      }
    }
  }
  // Brand
  const brandMatch = text.match(/brand[:\s]*([\w\s]+)/i);
  if (brandMatch) document.getElementById('bf-brand').value = brandMatch[1].trim();
  // Customer
  const custMatch = text.match(/customer[:\s]*([\w\s()]+)/i);
  if (custMatch) document.getElementById('bf-customer').value = custMatch[1].trim();
  // Description
  const descMatch = text.match(/description[:\s]*([\s\S]+?)(?=distribution|country|milestone|certif|$)/i);
  if (descMatch) document.getElementById('bf-desc').value = descMatch[1].trim().substring(0, 2000);
  // Country of origin
  if (t.includes('made in usa') || t.includes('usa')) {
    if (!document.querySelector('#bf-countries .country-tag[data-v="USA"]')) {
      const c = document.getElementById('bf-countries');
      const add = c.querySelector('.brief-tag-add');
      const span = document.createElement('span');
      span.className = 'country-tag';
      span.dataset.v = 'USA';
      span.innerHTML = '🇺🇸 USA <span class="tag-x" onclick="this.parentElement.remove()">×</span>';
      c.insertBefore(span, add);
    }
    if (t.includes('non-negotiable')) document.getElementById('bf-country-stip').value = 'Made in USA non-negotiable';
  }
  // Channels
  const channelKeywords = ['amazon','dtc','walmart','tiktok shop','tiktok','wholesale','retail','distributor'];
  channelKeywords.forEach(ch => {
    if (t.includes(ch)) {
      const label = ch === 'tiktok' ? 'TikTok Shop' : ch.charAt(0).toUpperCase()+ch.slice(1);
      if (!document.querySelector('#bf-channels .brief-tag[data-v="'+label+'"]')) {
        const c = document.getElementById('bf-channels');
        const add = c.querySelector('.brief-tag-add');
        const span = document.createElement('span');
        span.className = 'brief-tag';
        span.dataset.v = label;
        span.innerHTML = label + ' <span class="tag-x" onclick="this.parentElement.remove()">×</span>';
        c.insertBefore(span, add);
      }
    }
  });
  // Dates - look for DD-MM-YYYY or YYYY-MM-DD patterns near date labels
  const datePatterns = [
    {label: 'delivery date into dc', field: 'bf-d2'},
    {label: 'initial quote due', field: 'bf-d1'},
    {label: 'sample due', field: 'bf-d3'},
    {label: 'formulation approval', field: 'bf-d5'},
    {label: 'packaging approval', field: 'bf-d6'},
    {label: 'po date', field: 'bf-d7'},
    {label: 'dispatch', field: 'bf-d8'},
  ];
  datePatterns.forEach(dp => {
    const re = new RegExp(dp.label + '[^\d]*(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})', 'i');
    const m = text.match(re);
    if (m) {
      let d = m[1].replace(/\//g, '-');
      // Try to parse and set
      try {
        const parts = d.split('-');
        if (parts[2] && parts[2].length === 2) parts[2] = '20' + parts[2];
        // Assume DD-MM-YYYY
        const iso = parts[2] + '-' + parts[1].padStart(2,'0') + '-' + parts[0].padStart(2,'0');
        document.getElementById(dp.field).value = iso;
      } catch(e) {}
    }
  });
  // Priority
  if (t.includes('urgent')) document.getElementById('bf-priority').value = 'Urgent';
  else if (t.includes('high priority')) document.getElementById('bf-priority').value = 'High';
  // USP
  const uspMatch = text.match(/usp[:\s]*([\s\S]+?)(?=\n\n|certif|$)/i);
  if (uspMatch) document.getElementById('bf-usp').value = uspMatch[1].trim().substring(0, 200);
  // Formulation type
  if (t.includes('white label')) document.getElementById('bf-form-type').value = 'White Label';
  else if (t.includes('custom')) document.getElementById('bf-form-type').value = 'Custom';
  else if (t.includes('parallel')) document.getElementById('bf-form-type').value = 'Parallel Path (Both)';
  // Certifications
  const certKeywords = {'oeko':'OEKO-TEX Standard 100','gots':'GOTS','grs':'GRS','iso 9001':'ISO 9001','iso 14001':'ISO 14001','bsci':'BSCI','fair trade':'Fair Trade','fda':'FDA Registered','cgmp':'cGMP'};
  const certSelect = document.getElementById('bf-certs');
  if (certSelect) {
    Array.from(certSelect.options).forEach(opt => {
      Object.values(certKeywords).forEach(kw => {
        if (opt.value === kw && t.includes(Object.keys(certKeywords).find(k=>certKeywords[k]===kw))) opt.selected = true;
      });
    });
  }
}
